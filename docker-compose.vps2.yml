version: "3.9"

services:
  #  Backend Node 2 — VPS 2, same config as Node 1, shared DB + Redis
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/shortlink-backend:${BE_IMAGE_TAG:-latest}
    container_name: shortlink_backend_node2
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: "0.0.0.0"

      #  CORS & client URLs
      CORS_ORIGIN: ${CORS_ORIGIN}
      CORS_ORIGIN_PUBLIC: ${CORS_ORIGIN_PUBLIC}
      CLIENT_SHORT_LINK: ${CLIENT_SHORT_LINK}
      SERVER_ALIAS_URL: ${SERVER_ALIAS_URL}

      #  Rate limiting
      COMMON_RATE_LIMIT_WINDOW_MS: ${COMMON_RATE_LIMIT_WINDOW_MS:-1000}
      COMMON_RATE_LIMIT_MAX_REQUESTS: ${COMMON_RATE_LIMIT_MAX_REQUESTS:-100}

      #  Database (MongoDB — shared with Node 1)
      DATABASE_URL: ${DATABASE_URL}

      #  Redis — shared with Node 1 for stateless session sync
      REDIS_URL: ${REDIS_URL}

      # JWT & security
      PRIVATE_ACCESS_TOKEN_KEY: ${PRIVATE_ACCESS_TOKEN_KEY}
      PRIVATE_REFRESH_TOKEN_KEY: ${PRIVATE_REFRESH_TOKEN_KEY}
      ALGORITHM_JWT: ${ALGORITHM_JWT:-HS256}
      ACCESS_TOKEN_EXPIRATION_TIME: ${ACCESS_TOKEN_EXPIRATION_TIME:-1h}
      REFRESH_TOKEN_EXPIRATION_TIME: ${REFRESH_TOKEN_EXPIRATION_TIME:-3d}
      SECRET_OR_PUBLIC_JWT_KEY: ${SECRET_OR_PUBLIC_JWT_KEY}
      PRIVATE_PASSWORD: ${PRIVATE_PASSWORD}
      PASSWORD_SECRET: ${PASSWORD_SECRET}

      #  Email (SMTP)
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      CLIENT_URL: ${CLIENT_URL}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}

      #  Google OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

      #  Google reCAPTCHA
      SECRECT_KEY_RECAPCHA: ${SECRECT_KEY_RECAPCHA}

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
